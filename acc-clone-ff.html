<body>

<script>

/*
================================================
KHO ACC CLONE FF
================================================

Hiện tại: 0 ACC
=> Tự động báo HẾT HÀNG

Giá: 1K5 / ACC

Khi thêm acc vào mảng accounts,
trạng thái sẽ tự chuyển thành CÓ HÀNG.
================================================
*/

const accounts = [

    // KHO ĐANG TRỐNG

];

const accountList = document.getElementById("accountList");
const status = document.getElementById("status");
const emptyMessage = document.getElementById("emptyMessage");

function updateStock() {

    accountList.innerHTML = "";

    if (accounts.length === 0) {

        status.innerHTML = "🔴 HẾT HÀNG";

        status.style.color = "#ff1744";
        status.style.borderColor = "#ff1744";
        status.style.boxShadow =
            "0 0 12px rgba(255, 0, 60, 0.45)";

        emptyMessage.style.display = "block";

        return;
    }

    status.innerHTML = "🟢 CÓ HÀNG";

    status.style.color = "#00ff88";
    status.style.borderColor = "#00ff88";
    status.style.boxShadow =
        "0 0 12px rgba(0, 255, 136, 0.45)";

    emptyMessage.style.display = "none";

    accounts.forEach((account, index) => {

        const product = document.createElement("div");

        product.className = "product";

        product.innerHTML = `
            <div class="product-name">
                ACC CLONE FF #${index + 1}
            </div>

            <div class="price">
                💰 1K5 / ACC
            </div>

            <div class="stock">
                🟢 CÓ HÀNG
            </div>
        `;

        accountList.appendChild(product);

    });
}

updateStock();

</script>
