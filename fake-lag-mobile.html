<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fake Lag Mobile</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    min-height:100vh;
    background:#050008;
    color:white;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.container{
    width:100%;
    max-width:430px;
    background:linear-gradient(145deg,#0b0012,#16001f);
    border:1px solid #a000ff;
    border-radius:22px;
    padding:24px;
    box-shadow:0 0 25px #7200ff55;
}

.header{
    text-align:center;
    margin-bottom:25px;
}

.logo{
    width:75px;
    height:75px;
    margin:auto;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#0b0010;
    border:2px solid #b000ff;
    box-shadow:0 0 20px #a000ff;
    font-size:30px;
    font-weight:bold;
    color:#c000ff;
}

h1{
    margin-top:15px;
    font-size:25px;
    color:#d000ff;
    text-shadow:0 0 12px #a000ff;
}

.subtitle{
    margin-top:7px;
    color:#aaa;
    font-size:13px;
}

.status{
    margin:20px 0;
    padding:14px;
    border-radius:13px;
    background:#0b0010;
    border:1px solid #6500a0;
    text-align:center;
}

.status span{
    color:#c000ff;
    font-weight:bold;
}

.option{
    margin-top:13px;
    padding:15px;
    background:#09000e;
    border:1px solid #43005f;
    border-radius:14px;
}

.option label{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:15px;
}

.switch{
    position:relative;
    width:48px;
    height:25px;
}

.switch input{
    display:none;
}

.slider{
    position:absolute;
    inset:0;
    background:#25002f;
    border-radius:30px;
    cursor:pointer;
    transition:.3s;
}

.slider:before{
    content:"";
    position:absolute;
    width:19px;
    height:19px;
    left:3px;
    top:3px;
    background:#aaa;
    border-radius:50%;
    transition:.3s;
}

input:checked + .slider{
    background:#8c00ff;
    box-shadow:0 0 12px #a000ff;
}

input:checked + .slider:before{
    transform:translateX(23px);
    background:white;
}

.btn{
    width:100%;
    margin-top:22px;
    padding:15px;
    border:0;
    border-radius:14px;
    background:linear-gradient(90deg,#7200ff,#c000ff);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    box-shadow:0 0 18px #9d00ff66;
}

.btn:active{
    transform:scale(.97);
}

.info{
    margin-top:18px;
    padding:13px;
    border-radius:12px;
    background:#0b0011;
    border-left:3px solid #a000ff;
    color:#aaa;
    font-size:12px;
    line-height:1.6;
}

.footer{
    text-align:center;
    margin-top:18px;
    font-size:11px;
    color:#666;
}
</style>
</head>

<body>

<div class="container">

    <div class="header">
        <div class="logo">FL</div>

        <h1>FAKE LAG MOBILE</h1>

        <div class="subtitle">
            Mobile Performance Tool
        </div>
    </div>

    <div class="status">
        Trạng thái:
        <span id="status">ĐANG TẮT</span>
    </div>

    <div class="option">
        <label>
            Fake Lag
            <span class="switch">
                <input type="checkbox" id="fakeLag">
                <span class="slider"></span>
            </span>
        </label>
    </div>

    <div class="option">
        <label>
            Lag nhẹ
            <span class="switch">
                <input type="checkbox" id="lightLag">
                <span class="slider"></span>
            </span>
        </label>
    </div>

    <div class="option">
        <label>
            Tối ưu Mobile
            <span class="switch">
                <input type="checkbox" id="optimize">
                <span class="slider"></span>
            </span>
        </label>
    </div>

    <button class="btn" onclick="activate()">
        KÍCH HOẠT
    </button>

    <div class="info">
        ⚡ Fake Lag Mobile<br>
        Giao diện riêng cho kho Fake Lag Mobile.<br>
        Không liên quan đến Panel PC hoặc các kho khác.
    </div>

    <div class="footer">
        © TomModTaiWan
    </div>

</div>

<script>
function activate(){

    const fakeLag = document.getElementById("fakeLag").checked;
    const lightLag = document.getElementById("lightLag").checked;
    const optimize = document.getElementById("optimize").checked;

    const status = document.getElementById("status");

    if(fakeLag || lightLag || optimize){
        status.innerText = "ĐÃ BẬT";
        status.style.color = "#d000ff";
    }else{
        status.innerText = "ĐANG TẮT";
        status.style.color = "#c000ff";
    }
}
</script>

</body>
  </html>
