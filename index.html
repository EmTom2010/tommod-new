<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#020814">
<title>TomModTaiWan</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
    background:#020814;
}

/* =========================
   NEON BACKGROUND
========================= */

.background{
    position:fixed;
    inset:0;
    z-index:-10;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 16%,
            rgba(0,190,255,.30),
            transparent 27%
        ),
        radial-gradient(
            circle at 0% 65%,
            rgba(0,90,255,.25),
            transparent 35%
        ),
        radial-gradient(
            circle at 100% 85%,
            rgba(0,255,255,.20),
            transparent 32%
        ),
        linear-gradient(
            145deg,
            #01050b 0%,
            #031426 48%,
            #01050b 100%
        );
}

.background::before{
    content:"";
    position:absolute;
    width:330px;
    height:330px;
    left:-120px;
    top:-90px;
    border-radius:50%;
    background:#008cff;
    filter:blur(95px);
    opacity:.34;
    animation:glowMove1 8s ease-in-out infinite alternate;
}

.background::after{
    content:"";
    position:absolute;
    width:360px;
    height:360px;
    right:-140px;
    bottom:-120px;
    border-radius:50%;
    background:#00eaff;
    filter:blur(105px);
    opacity:.25;
    animation:glowMove2 10s ease-in-out infinite alternate;
}

@keyframes glowMove1{
    from{
        transform:translate(0,0) scale(1);
    }
    to{
        transform:translate(80px,100px) scale(1.2);
    }
}

@keyframes glowMove2{
    from{
        transform:translate(0,0) scale(1);
    }
    to{
        transform:translate(-80px,-60px) scale(1.2);
    }
}

/* =========================
   PARTICLES
========================= */

.particles{
    position:absolute;
    inset:0;
    opacity:.38;

    background-image:
        radial-gradient(
            circle,
            rgba(255,255,255,.9) 1px,
            transparent 1px
        ),
        radial-gradient(
            circle,
            rgba(0,220,255,.8) 1px,
            transparent 1px
        );

    background-size:
        85px 85px,
        130px 130px;

    background-position:
        10px 20px,
        60px 70px;

    animation:particleMove 18s linear infinite;
}

@keyframes particleMove{
    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(-85px);
    }
}

/* =========================
   PAGE
========================= */

.page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:48px 16px 50px;
}

.card{
    width:min(400px,100%);
    text-align:center;
}

/* =========================
   AVATAR
========================= */

.avatar-box{
    position:relative;
    width:116px;
    height:116px;
    margin:0 auto 25px;
}

.avatar-box::before{
    content:"";
    position:absolute;
    inset:-5px;
    border-radius:50%;

    background:
        conic-gradient(
            from 0deg,
            #ffffff,
            #00eaff,
            #008cff,
            #004cff,
            #00eaff,
            #ffffff
        );

    box-shadow:
        0 0 15px rgba(0,220,255,.9),
        0 0 38px rgba(0,120,255,.7);

    animation:avatarSpin 5s linear infinite;
}

.avatar-box::after{
    content:"";
    position:absolute;
    inset:-13px;
    border-radius:50%;

    border:1px solid rgba(0,220,255,.45);

    box-shadow:
        0 0 25px rgba(0,220,255,.45),
        0 0 60px rgba(0,100,255,.25);

    animation:ringPulse 2.5s ease-in-out infinite;
}

@keyframes avatarSpin{
    to{
        transform:rotate(360deg);
    }
}

@keyframes ringPulse{
    0%,100%{
        transform:scale(1);
        opacity:.45;
    }

    50%{
        transform:scale(1.08);
        opacity:1;
    }
}

.avatar{
    position:relative;
    z-index:2;

    width:116px;
    height:116px;

    display:block;
    object-fit:cover;

    border-radius:50%;
    border:3px solid #020814;
}

/* =========================
   NAME
========================= */

.name{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;

    font-size:31px;
    line-height:1.1;
    font-weight:800;
    letter-spacing:-1px;

    text-shadow:
        0 0 8px rgba(255,255,255,.25),
        0 3px 15px rgba(0,0,0,.9);
}

.verified{
    width:24px;
    height:24px;
    flex:0 0 24px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#168cff;

    box-shadow:
        0 0 10px rgba(0,170,255,.9),
        0 0 22px rgba(0,110,255,.55);
}

.verified::before{
    content:"✓";
    color:#fff;
    font-size:15px;
    font-weight:900;
}

/* =========================
   BIO
========================= */

.bio{
    margin:13px 0 29px;

    color:rgba(225,248,255,.88);

    font-size:15px;

    text-shadow:
        0 0 9px rgba(0,180,255,.25);
}

/* =========================
   PREMIUM LINKS
========================= */

.links{
    display:flex;
    flex-direction:column;
    gap:13px;
}

.link{
    position:relative;

    height:60px;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    color:#fff;
    text-decoration:none;

    border:1px solid rgba(0,225,255,.7);
    border-radius:18px;

    background:
        linear-gradient(
            110deg,
            rgba(0,70,150,.48),
            rgba(0,190,255,.16),
            rgba(0,65,140,.48)
        );

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    box-shadow:
        0 8px 25px rgba(0,0,0,.5),
        inset 0 1px 0 rgba(255,255,255,.15),
        inset 0 0 22px rgba(0,200,255,.10),
        0 0 16px rgba(0,190,255,.28);

    font-size:17px;
    font-weight:800;
    letter-spacing:.2px;

    transition:
        transform .2s ease,
        box-shadow .2s ease,
        border-color .2s ease,
        background .2s ease;
}

/* =========================
   ICON
========================= */

.link .icon{
    position:absolute;
    left:16px;

    width:34px;
    height:34px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:11px;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            rgba(0,230,255,.42),
            rgba(0,80,255,.28)
        );

    border:1px solid rgba(0,235,255,.65);

    box-shadow:
        0 0 12px rgba(0,210,255,.35),
        inset 0 0 10px rgba(255,255,255,.08);

    font-size:17px;
    font-weight:900;

    z-index:3;
}

/* =========================
   MOVING LIGHT
========================= */

.link::before{
    content:"";

    position:absolute;

    top:-30%;
    left:-100%;

    width:60%;
    height:160%;

    transform:skewX(-25deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.32),
            rgba(0,235,255,.28),
            transparent
        );

    transition:left .65s ease;
}

.link:hover::before{
    left:150%;
}

/* =========================
   LINK HOVER
========================= */

.link:hover{
    transform:translateY(-3px);

    border-color:#00efff;

    background:
        linear-gradient(
            110deg,
            rgba(0,110,220,.55),
            rgba(0,225,255,.23),
            rgba(0,100,210,.55)
        );

    box-shadow:
        0 12px 30px rgba(0,0,0,.5),
        0 0 22px rgba(0,220,255,.55),
        0 0 50px rgba(0,130,255,.20),
        inset 0 0 24px rgba(0,220,255,.12);
}

/* =========================
   TAP EFFECT
========================= */

.link:active{
    transform:scale(.94);

    border-color:#ffffff;

    background:
        linear-gradient(
            110deg,
            rgba(0,130,255,.65),
            rgba(0,245,255,.30),
            rgba(0,110,255,.60)
        );

    box-shadow:
        0 0 25px rgba(0,230,255,.9),
        0 0 55px rgba(0,120,255,.55),
        inset 0 0 25px rgba(255,255,255,.12);
}

/* =========================
   INDIVIDUAL COLORS
========================= */

.link:nth-child(1){
    border-color:rgba(40,160,255,.8);
}

.link:nth-child(2){
    border-color:rgba(0,235,255,.8);
}

.link:nth-child(3){
    border-color:rgba(80,150,255,.8);
}

.link:nth-child(4){
    border-color:rgba(0,255,240,.8);
}

.link:nth-child(5){
    border-color:rgba(70,125,255,.8);
}

/* =========================
   BOTTOM LINE
========================= */

.line{
    width:52px;
    height:3px;

    margin:26px auto 0;

    border-radius:20px;

    background:#00eaff;

    box-shadow:
        0 0 8px #00eaff,
        0 0 20px #008cff,
        0 0 35px rgba(0,180,255,.55);

    animation:lineGlow 2s ease-in-out infinite;
}

@keyframes lineGlow{
    0%,100%{
        width:35px;
        opacity:.5;
    }

    50%{
        width:70px;
        opacity:1;
    }
}

/* =========================
   MOBILE
========================= */

@media(max-width:390px){

    .page{
        padding-top:43px;
    }

    .avatar-box,
    .avatar{
        width:105px;
        height:105px;
    }

    .name{
        font-size:28px;
    }

    .verified{
        width:21px;
        height:21px;
        flex-basis:21px;
    }

    .verified::before{
        font-size:14px;
    }

    .bio{
        font-size:14px;
        margin-bottom:25px;
    }

    .link{
        height:57px;
        border-radius:16px;
        font-size:16px;
    }

    .link .icon{
        left:14px;
        width:32px;
        height:32px;
    }
}
</style>
</head>

</body>
</html>
