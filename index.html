<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#050505">
<title>TomModTaiWan</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
    background:#050505;
}

/* ===== BACKGROUND ===== */

.bg{
    position:fixed;
    inset:0;
    z-index:-10;
    overflow:hidden;
    background:
        radial-gradient(
            circle at 50% 20%,
            rgba(255,0,55,.13),
            transparent 28%
        ),
        linear-gradient(
            135deg,
            #020202 0%,
            #090909 50%,
            #030303 100%
        );
}

.bg::before,
.bg::after{
    content:"";
    position:absolute;
    border-radius:50%;
    filter:blur(80px);
    opacity:.35;
    animation:moveGlow 9s ease-in-out infinite alternate;
}

.bg::before{
    width:260px;
    height:260px;
    background:#ff003c;
    top:-80px;
    left:-100px;
}

.bg::after{
    width:300px;
    height:300px;
    background:#6d003d;
    right:-130px;
    bottom:-100px;
    animation-delay:-4s;
}

@keyframes moveGlow{
    from{
        transform:translate(0,0) scale(1);
    }
    to{
        transform:translate(45px,35px) scale(1.2);
    }
}

/* floating particles */

.particles{
    position:absolute;
    inset:0;
    opacity:.3;
    background-image:
        radial-gradient(circle,rgba(255,255,255,.8) 1px,transparent 1px),
        radial-gradient(circle,rgba(255,0,60,.7) 1px,transparent 1px);
    background-size:90px 90px,140px 140px;
    background-position:20px 10px,70px 50px;
    animation:stars 20s linear infinite;
}

@keyframes stars{
    from{
        transform:translateY(0);
    }
    to{
        transform:translateY(-90px);
    }
}

/* ===== PAGE ===== */

.page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:48px 18px 45px;
}

.card{
    width:min(390px,100%);
    text-align:center;
}

/* ===== AVATAR ===== */

.avatar-wrap{
    position:relative;
    width:112px;
    height:112px;
    margin:0 auto 22px;
}

.avatar-wrap::before{
    content:"";
    position:absolute;
    inset:-5px;
    border-radius:50%;
    background:conic-gradient(
        from 0deg,
        #fff,
        #ff174f,
        #ff003c,
        #8b0030,
        #fff
    );
    animation:spin 5s linear infinite;
}

.avatar-wrap::after{
    content:"";
    position:absolute;
    inset:-11px;
    border-radius:50%;
    border:1px solid rgba(255,0,60,.28);
    box-shadow:0 0 30px rgba(255,0,60,.28);
    animation:pulseRing 2.5s ease-in-out infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

@keyframes pulseRing{
    0%,100%{
        transform:scale(1);
        opacity:.45;
    }
    50%{
        transform:scale(1.06);
        opacity:1;
    }
}

.avatar{
    position:relative;
    z-index:2;
    width:112px;
    height:112px;
    display:block;
    object-fit:cover;
    border-radius:50%;
    border:3px solid #070707;
}

/* ===== NAME ===== */

.name{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;
    font-size:31px;
    line-height:1.1;
    font-weight:800;
    letter-spacing:-1.2px;
    text-shadow:
        0 2px 10px rgba(0,0,0,.9);
}

.verified{
    width:23px;
    height:23px;
    flex:0 0 23px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:#168df5;
    box-shadow:
        0 0 10px rgba(22,141,245,.55);
}

.verified::before{
    content:"✓";
    color:#fff;
    font-size:15px;
    font-weight:900;
}

/* ===== BIO ===== */

.bio{
    margin:12px 0 27px;
    color:rgba(255,255,255,.7);
    font-size:15px;
    letter-spacing:.2px;
}

/* ===== LINKS ===== */

.links{
    display:flex;
    flex-direction:column;
    gap:11px;
}

.link{
    position:relative;
    height:53px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;

    color:#fff;
    text-decoration:none;

    border:1px solid rgba(255,255,255,.13);
    border-radius:15px;

    background:
        linear-gradient(
            110deg,
            rgba(255,255,255,.055),
            rgba(255,0,55,.08),
            rgba(255,255,255,.025)
        );

    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);

    box-shadow:
        0 10px 30px rgba(0,0,0,.3),
        inset 0 1px rgba(255,255,255,.07);

    font-size:16px;
    font-weight:700;

    transition:
        transform .2s ease,
        border-color .2s ease,
        box-shadow .2s ease,
        background .2s ease;
}

.link::before{
    content:"";
    position:absolute;
    top:0;
    left:-120%;
    width:70%;
    height:100%;
    transform:skewX(-25deg);
    background:linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,.16),
        transparent
    );
    transition:left .55s ease;
}

.link:hover{
    border-color:rgba(255,0,60,.6);
    box-shadow:
        0 0 22px rgba(255,0,60,.2),
        inset 0 1px rgba(255,255,255,.1);
}

.link:hover::before{
    left:150%;
}

.link:active{
    transform:scale(.965);
    border-color:#ff174f;
    background:rgba(255,0,55,.13);
    box-shadow:
        0 0 28px rgba(255,0,60,.35),
        inset 0 0 18px rgba(255,0,60,.08);
}

/* ===== SMALL RED LINE ===== */

.line{
    width:42px;
    height:2px;
    margin:24px auto 0;
    border-radius:20px;
    background:#ff174f;
    box-shadow:0 0 12px #ff174f;
    animation:linePulse 2s ease-in-out infinite;
}

@keyframes linePulse{
    0%,100%{
        width:30px;
        opacity:.45;
    }
    50%{
        width:55px;
        opacity:1;
    }
}

/* ===== MOBILE ===== */

@media(max-width:390px){

    .page{
        padding-top:42px;
    }

    .avatar-wrap,
    .avatar{
        width:104px;
        height:104px;
    }

    .name{
        font-size:28px;
    }

    .verified{
        width:21px;
        height:21px;
        flex-basis:21px;
    }

    .verified::before{
        font-size:14px;
    }

    .bio{
        font-size:14px;
        margin-bottom:24px;
    }

    .link{
        height:51px;
        border-radius:14px;
        font-size:15px;
    }
}
</style>
</head>

<body>

<div class="bg">
    <div class="particles"></div>
</div>

<main class="page">
    <section class="card">

        <div class="avatar-wrap">
            <img
                class="avatar"
                src="avatar.png"
                alt="TomModTaiWan">
        </div>

        <h1 class="name">
            <span>TomModTaiWan</span>
            <span class="verified"></span>
        </h1>

        <p class="bio">
            TomModTaiWan. Xin Kính Chào Bạn.
        </p>

        <div class="links">

            <a class="link"
               href="https://www.facebook.com/share/1cQg31DP2L/"
               target="_blank"
               rel="noopener">
                Facebook
            </a>

            <a class="link"
               href="https://www.tiktok.com/@tluocc_010"
               target="_blank"
               rel="noopener">
                TikTok
            </a>

            <a class="link"
               href="https://discord.gg/xhc"
               target="_blank"
               rel="noopener">
                Discord
            </a>

            <a class="link"
               href="https://t.me/tluoc_09"
               target="_blank"
               rel="noopener">
                Telegram
            </a>

            <a class="link"
               href="https://linkbio.co/8070700OwKBiF"
               target="_blank"
               rel="noopener">
                Link Bio
            </a>

        </div>

        <div class="line"></div>

    </section>
</main>

<audio id="music" loop preload="auto">
    <source src="tiktok_mp3.mp3" type="audio/mpeg">
</audio>

<script>

        music.play().catch(() => {});

</body>
</html>
