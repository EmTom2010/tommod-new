<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#020810">
<title>TomModTaiWan</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
    background:#02060b;
}

/* ===== NEON BLUE BACKGROUND ===== */

.bg{
    position:fixed;
    inset:0;
    overflow:hidden;
    z-index:-10;
    background:
        radial-gradient(
            circle at 50% 18%,
            rgba(0,170,255,.30),
            transparent 28%
        ),
        radial-gradient(
            circle at 5% 55%,
            rgba(0,90,255,.22),
            transparent 32%
        ),
        radial-gradient(
            circle at 95% 80%,
            rgba(0,255,255,.18),
            transparent 30%
        ),
        linear-gradient(
            135deg,
            #010409,
            #03101c 48%,
            #010409
        );
}

.bg::before{
    content:"";
    position:absolute;
    width:360px;
    height:360px;
    top:-130px;
    left:-120px;
    border-radius:50%;
    background:#008cff;
    filter:blur(100px);
    opacity:.30;
    animation:floatOne 8s ease-in-out infinite alternate;
}

.bg::after{
    content:"";
    position:absolute;
    width:390px;
    height:390px;
    right:-150px;
    bottom:-150px;
    border-radius:50%;
    background:#00eaff;
    filter:blur(110px);
    opacity:.22;
    animation:floatTwo 10s ease-in-out infinite alternate;
}

@keyframes floatOne{
    from{
        transform:translate(0,0) scale(1);
    }
    to{
        transform:translate(55px,70px) scale(1.18);
    }
}

@keyframes floatTwo{
    from{
        transform:translate(0,0) scale(1);
    }
    to{
        transform:translate(-60px,-45px) scale(1.2);
    }
}

/* ===== PARTICLES ===== */

.particles{
    position:absolute;
    inset:0;
    opacity:.38;
    background-image:
        radial-gradient(
            circle,
            rgba(255,255,255,.85) 1px,
            transparent 1px
        ),
        radial-gradient(
            circle,
            rgba(0,200,255,.9) 1px,
            transparent 1px
        );
    background-size:85px 85px,125px 125px;
    background-position:15px 20px,55px 70px;
    animation:particlesMove 18s linear infinite;
}

@keyframes particlesMove{
    from{
        transform:translateY(0);
    }
    to{
        transform:translateY(-85px);
    }
}

/* ===== PAGE ===== */

.page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:50px 18px 45px;
}

.card{
    width:min(390px,100%);
    text-align:center;
}

/* ===== AVATAR ===== */

.avatar-wrap{
    position:relative;
    width:112px;
    height:112px;
    margin:0 auto 23px;
}

.avatar-wrap::before{
    content:"";
    position:absolute;
    inset:-5px;
    border-radius:50%;
    background:conic-gradient(
        from 0deg,
        #ffffff,
        #00eaff,
        #008cff,
        #0055ff,
        #ffffff
    );
    box-shadow:
        0 0 15px rgba(0,210,255,.9),
        0 0 40px rgba(0,130,255,.65);
    animation:spin 5s linear infinite;
}

.avatar-wrap::after{
    content:"";
    position:absolute;
    inset:-13px;
    border-radius:50%;
    border:1px solid rgba(0,220,255,.45);
    box-shadow:
        0 0 25px rgba(0,200,255,.55),
        0 0 55px rgba(0,100,255,.3);
    animation:ringPulse 2.5s ease-in-out infinite;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

@keyframes ringPulse{
    0%,100%{
        transform:scale(1);
        opacity:.45;
    }
    50%{
        transform:scale(1.08);
        opacity:1;
    }
}

.avatar{
    position:relative;
    z-index:2;
    width:112px;
    height:112px;
    display:block;
    object-fit:cover;
    border-radius:50%;
    border:3px solid #02060b;
}

/* ===== NAME ===== */

.name{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    font-size:31px;
    line-height:1.1;
    font-weight:800;
    letter-spacing:-1.2px;
    text-shadow:
        0 0 8px rgba(255,255,255,.25),
        0 3px 12px rgba(0,0,0,.9);
}

.verified{
    width:23px;
    height:23px;
    flex:0 0 23px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:50%;
    background:#168cff;
    color:#fff;
    box-shadow:
        0 0 10px rgba(0,160,255,.9),
        0 0 20px rgba(0,120,255,.45);
}

.verified::before{
    content:"✓";
    font-size:15px;
    font-weight:900;
}

/* ===== BIO ===== */

.bio{
    margin:13px 0 28px;
    color:rgba(220,245,255,.85);
    font-size:15px;
    text-shadow:0 0 8px rgba(0,170,255,.25);
}

/* ===== LINKS ===== */

.links{
    display:flex;
    flex-direction:column;
    gap:12px;
}

.link{
    position:relative;
    height:54px;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;

    color:#fff;
    text-decoration:none;

    border:1px solid rgba(0,210,255,.55);
    border-radius:16px;

    background:
        linear-gradient(
            105deg,
            rgba(0,100,180,.18),
            rgba(0,220,255,.08),
            rgba(0,70,150,.20)
        );

    backdrop-filter:blur(16px);
    -webkit-backdrop-filter:blur(16px);

    box-shadow:
        0 8px 28px rgba(0,0,0,.35),
        inset 0 1px rgba(255,255,255,.08),
        0 0 14px rgba(0,170,255,.13);

    font-size:16px;
    font-weight:700;

    transition:
        transform .2s ease,
        border-color .2s ease,
        box-shadow .2s ease,
        background .2s ease;
}

.link::before{
    content:"";
    position:absolute;
    top:0;
    left:-120%;
    width:65%;
    height:100%;
    transform:skewX(-25deg);
    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.20),
            transparent
        );
    transition:left .55s ease;
}

.link:hover{
    border-color:#00d9ff;
    box-shadow:
        0 0 20px rgba(0,200,255,.32),
        inset 0 1px rgba(255,255,255,.12);
}

.link:hover::before{
    left:150%;
}

.link:active{
    transform:scale(.96);
    border-color:#00eaff;
    background:
        linear-gradient(
            105deg,
            rgba(0,130,255,.28),
            rgba(0,230,255,.15),
            rgba(0,100,255,.25)
        );
    box-shadow:
        0 0 30px rgba(0,220,255,.55),
        inset 0 0 20px rgba(0,180,255,.12);
}

/* ===== BOTTOM NEON ===== */

.line{
    width:45px;
    height:2px;
    margin:25px auto 0;
    border-radius:20px;
    background:#00d9ff;
    box-shadow:
        0 0 8px #00d9ff,
        0 0 18px #008cff;
    animation:linePulse 2s ease-in-out infinite;
}

@keyframes linePulse{
    0%,100%{
        width:30px;
        opacity:.45;
    }
    50%{
        width:60px;
        opacity:1;
    }
}

/* ===== MOBILE ===== */

@media(max-width:390px){

    .page{
        padding-top:43px;
    }

    .avatar-wrap,
    .avatar{
        width:104px;
        height:104px;
    }

    .name{
        font-size:28px;
    }

    .verified{
        width:21px;
        height:21px;
        flex-basis:21px;
    }

    .verified::before{
        font-size:14px;
    }

    .bio{
        font-size:14px;
        margin-bottom:25px;
    }

    .link{
        height:51px;
        border-radius:14px;
        font-size:15px;
    }
}
</style>
</head>

<body>

<div class="bg">
    <div class="particles"></div>
</div>

<main class="page">
<section class="card">

    <div class="avatar-wrap">
        <img
            class="avatar"

    <div class="links">

</body>
</html>
