<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05020d">
<title>TomModTaiWan</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    overflow-x:hidden;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
    background:#05020d;
}

/* =========================
   PURPLE NEON BACKGROUND
========================= */

.background{
    position:fixed;
    inset:0;
    z-index:-10;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 15%,
            rgba(174,48,255,.34),
            transparent 29%
        ),
        radial-gradient(
            circle at 0% 55%,
            rgba(95,20,255,.28),
            transparent 38%
        ),
        radial-gradient(
            circle at 100% 82%,
            rgba(215,45,255,.24),
            transparent 35%
        ),
        linear-gradient(
            145deg,
            #020106 0%,
            #0c0318 48%,
            #020106 100%
        );
}

.background::before{
    content:"";
    position:absolute;
    width:390px;
    height:390px;
    left:-145px;
    top:-100px;
    border-radius:50%;
    background:#8d2cff;
    filter:blur(115px);
    opacity:.38;
    animation:glowMove1 8s ease-in-out infinite alternate;
}

.background::after{
    content:"";
    position:absolute;
    width:420px;
    height:420px;
    right:-160px;
    bottom:-150px;
    border-radius:50%;
    background:#c63cff;
    filter:blur(125px);
    opacity:.28;
    animation:glowMove2 10s ease-in-out infinite alternate;
}

@keyframes glowMove1{
    from{
        transform:translate(0,0) scale(1);
    }
    to{
        transform:translate(80px,100px) scale(1.2);
    }
}

@keyframes glowMove2{
    from{
        transform:translate(0,0) scale(1);
    }
    to{
        transform:translate(-80px,-60px) scale(1.2);
    }
}

/* =========================
   PARTICLES
========================= */

.particles{
    position:absolute;
    inset:0;
    opacity:.42;

    background-image:
        radial-gradient(
            circle,
            rgba(255,255,255,.9) 1px,
            transparent 1px
        ),
        radial-gradient(
            circle,
            rgba(190,70,255,.9) 1px,
            transparent 1px
        );

    background-size:
        85px 85px,
        130px 130px;

    background-position:
        10px 20px,
        60px 70px;

    animation:particleMove 18s linear infinite;
}

@keyframes particleMove{
    from{
        transform:translateY(0);
    }

    to{
        transform:translateY(-85px);
    }
}

/* =========================
   PAGE
========================= */

.page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:48px 16px 50px;
}

.card{
    width:min(400px,100%);
    text-align:center;
}

/* =========================
   AVATAR
========================= */

.avatar-box{
    position:relative;
    width:116px;
    height:116px;
    margin:0 auto 25px;
}

.avatar-box::before{
    content:"";
    position:absolute;
    inset:-7px;
    border-radius:50%;

    background:
        conic-gradient(
            from 0deg,
            #ffffff,
            #d75cff,
            #7025ff,
            #b92cff,
            #ffffff
        );

    box-shadow:
        0 0 18px rgba(200,80,255,.95),
        0 0 45px rgba(120,35,255,.8),
        0 0 80px rgba(200,50,255,.3);

    animation:avatarSpin 5s linear infinite;
}

.avatar-box::after{
    content:"";
    position:absolute;
    inset:-16px;
    border-radius:50%;

    border:1px solid rgba(215,100,255,.65);

    box-shadow:
        0 0 30px rgba(195,70,255,.55),
        0 0 75px rgba(105,25,255,.35);

    animation:ringPulse 2.5s ease-in-out infinite;
}

@keyframes avatarSpin{
    to{
        transform:rotate(360deg);
    }
}

@keyframes ringPulse{
    0%,100%{
        transform:scale(1);
        opacity:.45;
    }

    50%{
        transform:scale(1.08);
        opacity:1;
    }
}

.avatar{
    position:relative;
    z-index:2;

    width:116px;
    height:116px;

    display:block;
    object-fit:cover;

    border-radius:50%;
    border:3px solid #05020d;
}

/* =========================
   NAME
========================= */

.name{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:7px;

    font-size:31px;
    line-height:1.1;
    font-weight:800;
    letter-spacing:-1px;

    text-shadow:
        0 0 8px rgba(255,255,255,.25),
        0 0 18px rgba(190,70,255,.35),
        0 3px 15px rgba(0,0,0,.9);
}

.crown{
    color:#d26aff;
    font-size:22px;

    text-shadow:
        0 0 8px #c34cff,
        0 0 20px #7b2cff;
}

.verified{
    width:24px;
    height:24px;
    flex:0 0 24px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:#159fe8;

    box-shadow:
        0 0 10px rgba(20,190,255,.95),
        0 0 22px rgba(20,130,255,.65);
}

.verified::before{
    content:"✓";
    color:#fff;
    font-size:15px;
    font-weight:900;
}

/* =========================
   BIO
========================= */

.bio{
    margin:13px 0 29px;

    color:rgba(245,225,255,.9);

    font-size:15px;

    text-shadow:
        0 0 9px rgba(185,60,255,.4);
}

/* =========================
   LINKS
========================= */

.links{
    display:flex;
    flex-direction:column;
    gap:16px;
}

.link{
    position:relative;

    height:70px;

    display:flex;
    align-items:center;
    justify-content:center;

    overflow:hidden;

    color:#fff;
    text-decoration:none;

    border:1px solid rgba(195,80,255,.9);
    border-radius:20px;

    background:
        linear-gradient(
            105deg,
            rgba(30,7,55,.88),
            rgba(120,35,195,.22),
            rgba(12,4,30,.92)
        );

    backdrop-filter:blur(18px);
    -webkit-backdrop-filter:blur(18px);

    box-shadow:
        0 8px 25px rgba(0,0,0,.62),
        inset 0 1px 0 rgba(255,255,255,.16),
        inset 0 0 28px rgba(165,50,255,.16),
        0 0 18px rgba(160,45,255,.55),
        0 0 42px rgba(100,25,255,.22);

    font-size:18px;
    font-weight:800;

    letter-spacing:.2px;

    transition:
        transform .2s ease,
        box-shadow .2s ease,
        border-color .2s ease,
        background .2s ease;
}

/* =========================
   ICON
========================= */

.link .icon{
    position:absolute;
    left:15px;

    width:42px;
    height:42px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:14px;

    color:#fff;

    background:
        linear-gradient(
            145deg,
            rgba(125,40,220,.55),
            rgba(18,5,38,.9)
        );

    border:1px solid rgba(210,105,255,.85);

    box-shadow:
        0 0 15px rgba(175,60,255,.65),
        0 0 30px rgba(100,25,255,.25),
        inset 0 0 13px rgba(255,255,255,.08);

    z-index:3;
}

.link .icon svg{
    width:25px;
    height:25px;

    display:block;

    filter:
        drop-shadow(0 0 5px rgba(220,120,255,.9));
}

/* =========================
   RIGHT ARROW
========================= */

.arrow{
    position:absolute;

    right:18px;

    color:#ead0ff;

    font-size:29px;
    line-height:1;

    text-shadow:
        0 0 10px #b84cff,
        0 0 24px #7b2cff;

    animation:arrowGlow 1.8s ease-in-out infinite;
}

@keyframes arrowGlow{
    0%,100%{
        opacity:.55;
        transform:translateX(0);
    }

    50%{
        opacity:1;
        transform:translateX(3px);
    }
}

/* =========================
   MOVING LIGHT
========================= */

.link::before{
    content:"";

    position:absolute;

    top:-30%;
    left:-100%;

    width:60%;
    height:160%;

    transform:skewX(-25deg);

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.25),
            rgba(205,80,255,.38),
            transparent
        );

    transition:left .65s ease;
}

.link:hover::before{
    left:150%;
}

/* =========================
   HOVER
========================= */

.link:hover{
    transform:translateY(-3px) scale(1.01);

    border-color:#e3a5ff;

    background:
        linear-gradient(
            105deg,
            rgba(75,18,125,.9),
            rgba(170,55,255,.32),
            rgba(35,8,80,.92)
        );

    box-shadow:
        0 12px 30px rgba(0,0,0,.55),
        0 0 28px rgba(205,75,255,.8),
        0 0 62px rgba(110,30,255,.32),
        inset 0 0 30px rgba(185,65,255,.18);
}

/* =========================
   TAP
========================= */

.link:active{
    transform:scale(.95);

    border-color:#fff;

    box-shadow:
        0 0 30px rgba(220,125,255,.98),
        0 0 65px rgba(120,35,255,.65);
}

/* =========================
   INDIVIDUAL COLORS
========================= */

.link:nth-child(1){
    border-color:rgba(180,70,255,.95);
}

.link:nth-child(2){
    border-color:rgba(220,90,255,.95);
}

.link:nth-child(3){
    border-color:rgba(135,75,255,.95);
}

.link:nth-child(4){
    border-color:rgba(190,60,255,.95);
}

.link:nth-child(5){
    border-color:rgba(225,120,255,.95);
}

/* =========================
   BOTTOM LINE
========================= */

.line{
    width:58px;
    height:3px;

    margin:26px auto 0;

    border-radius:20px;

    background:#b84cff;

    box-shadow:
        0 0 8px #d05cff,
        0 0 20px #8b2cff,
        0 0 35px rgba(190,70,255,.6);

    animation:lineGlow 2s ease-in-out infinite;
}

@keyframes lineGlow{
    0%,100%{
        width:35px;
        opacity:.5;
    }

    50%{
        width:70px;
        opacity:1;
    }
}

/* =========================
   MOBILE
========================= */

@media(max-width:390px){

    .page{
        padding-top:43px;
    }

    .avatar-box,
    .avatar{
        width:105px;
        height:105px;
    }

    .name{
        font-size:28px;
    }

    .verified{
        width:21px;
        height:21px;
        flex-basis:21px;
    }

    .verified::before{
        font-size:14px;
    }

    .bio{
        font-size:14px;
        margin-bottom:25px;
    }

    .link{
        height:63px;
        border-radius:18px;
        font-size:17px;
    }

    .link .icon{
        left:14px;
        width:36px;
        height:36px;
    }

    .link .icon svg{
        width:22px;
        height:22px;
    }
}
</style>
</head>
